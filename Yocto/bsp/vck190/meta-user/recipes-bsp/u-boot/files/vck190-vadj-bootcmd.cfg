# Enable VADJ before every boot (ported from the PetaLinux BSP's
# platform-top.h "vadj_1v5_en", same register values; mechanism copied from
# the HW-verified 2x-qsfp28-fmc vck190 Yocto BSP).
#
# On VCK190 the FMC VADJ rail comes from the IR38164 buck regulator
# (I2C addr 0x1E behind mux 0x74 channel 0 on LPD I2C0). Normally the system
# controller enables it, but it is too slow / may be unconfigured: without
# this, VADJ is still off when Linux probes the FMC, so the FMC devices are
# dead at probe (FMC I2C scans empty, GT/PHY never come up).
#
# "i2c dev 1": the EDF u-boot numbers I2C buses by the SDT /aliases, so
# LPD I2C0 (ff020000) is bus 1 here: the design's PL AXI IIC (FMC
# side) takes alias i2c0, so LPD I2C0 is i2c1 (checked in a built u-boot DTB).
# This differs per design (2x-qsfp28-fmc: bus 3); re-check the aliases if the design's I2C controllers change.
# The write sequence programs the 1.5V VADJ profile and sets the enable bit
# (0x22=0x80) last.
CONFIG_CMD_I2C=y
CONFIG_BOOTCOMMAND="i2c dev 1; i2c mw 0x74 0x00.0 0x01 0x1; i2c mw 0x1E 0x24.1 0x01 0x1; i2c mw 0x1E 0x25.1 0x80 0x1; i2c mw 0x1E 0x3A.1 0x01 0x1; i2c mw 0x1E 0x3B.1 0xF3 0x1; i2c mw 0x1E 0x3D.1 0x01 0x1; i2c mw 0x1E 0x3E.1 0xF3 0x1; i2c mw 0x1E 0x3F.1 0x00 0x1; i2c mw 0x1E 0x40.1 0x00 0x1; i2c mw 0x1E 0x41.1 0x00 0x1; i2c mw 0x1E 0x42.1 0x00 0x1; i2c mw 0x1E 0x22.1 0x80 0x1; run distro_bootcmd"
